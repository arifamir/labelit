name: LabelIt
options:
  bundleIdPrefix: com.kodberry
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  LabelItCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  LabelIt:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [LabelIt.entitlements]
      - path: LICENSE
        buildPhase: resources
      - path: ThirdPartyLicenses
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: LabelItCore
        product: LabelItCore
      - package: LabelItCore
        product: LabelItEmbedding
      - package: LabelItCore
        product: LabelItPlatform
    preBuildScripts:
      - name: Build llama.cpp
        script: '"$SRCROOT/scripts/build-llama.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kodberry.labelit
        PRODUCT_NAME: LabelIt
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/llama/lib
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Signing: Config/Signing.xcconfig (ad hoc unless Config/Local.xcconfig says otherwise).
        # Hardened runtime, so a Developer ID build can be notarized.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/LabelIt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # App/Assets.xcassets, drawn by scripts/make-icon.swift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: LabelIt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "LabelIt asks your browser for the current page's address, so a screenshot remembers where it came from."
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: "LabelIt names new screenshots and phone photos that land on your Desktop."
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: "LabelIt names photos and videos you AirDrop from your iPhone or iPad."
        INFOPLIST_KEY_NSPicturesFolderUsageDescription: "LabelIt names photos imported from your iPhone or iPad."
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 M. Arif Amir and Kodberry"
